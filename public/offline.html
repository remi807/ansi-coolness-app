<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1646ff" />
    <title>Ansi ist gerade offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; background: #1646ff; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 680px); padding: clamp(28px, 8vw, 72px); background: #11110f; border: 3px solid #11110f; box-shadow: 12px 12px 0 #d8ff39; }
      p:first-child { display: inline-block; margin: 0 0 18px; padding: 7px 10px; color: #11110f; background: #d8ff39; font-size: 12px; font-weight: 900; letter-spacing: .15em; }
      h1 { margin: 0; font-size: clamp(48px, 13vw, 100px); line-height: .86; letter-spacing: -.08em; }
      p:last-child { margin: 24px 0 0; color: #d7d7d1; font-size: 18px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <p>OFFLINE-MODUS</p>
      <h1>Ansi lädt gerade Coolness nach.</h1>
      <p>Die App öffnet sich wieder, sobald deine Verbindung zurück ist.</p>
    </main>
  </body>
</html>
